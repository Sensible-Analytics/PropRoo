name: Daily ETL Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC (1 PM AEST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full re-ingest (ignore cache)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  DATA_DIR: backend/data
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  R2_BUCKET: proproo-data

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Step 1 — Ingest NSW Valuer General data (2001-2024)
        run: |
          mkdir -p ${{ env.DATA_DIR }}
          python backend/etl/ingest.py --start-year 2001 --end-year 2024
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Step 2 — Geocode properties
        run: |
          python backend/etl/geocode.py --data-dir ${{ env.DATA_DIR }}
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Step 3 — Calculate growth metrics
        run: |
          python -c "from backend.etl.calculate_growth import run_all; run_all()"
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Step 4 — Validate ETL output (basic validation)
        run: |
          python backend/etl/validate.py --data-dir ${{ env.DATA_DIR }}
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Step 5 — Enhanced Data Quality Validation
        run: |
          mkdir -p dq-reports
          python backend/etl/validate.py \
            --data-dir ${{ env.DATA_DIR }} \
            --output-dir dq-reports
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Step 6 — Soda Core Data Quality Scans
        if: false  # Disabled - soda-core-duckdb CLI syntax incompatibility
        run: |
          mkdir -p soda-reports
          python backend/etl/data_quality/dq_runner.py \
            --data-dir ${{ env.DATA_DIR }} \
            --output-dir soda-reports \
            --vars RUN_DATE=${{ github.event.schedule || 'manual' }} \
            || true  # Non-blocking - enhanced validation in Step 5 covers this
        env:
          DATA_DIR: ${{ env.DATA_DIR }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload parquet to Cloudflare R2
        run: |
          for f in ${{ env.DATA_DIR }}/*.parquet; do
            filename=$(basename "$f")
            echo "Uploading $filename..."
            wrangler r2 object put "${{ env.R2_BUCKET }}/$filename" --file="$f" --remote
          done

      - name: Upload Data Quality Reports to R2
        if: always()
        run: |
          RUN_DATE=$(date +%Y-%m-%d)
          mkdir -p dq-upload
          
          # Copy enhanced validation reports
          if [ -d "dq-reports" ]; then
            cp dq-reports/*.json dq-upload/ 2>/dev/null || true
            cp dq-reports/*.html dq-upload/ 2>/dev/null || true
          fi
          
          # Copy Soda scan reports
          if [ -d "soda-reports" ]; then
            cp soda-reports/*.json dq-upload/ 2>/dev/null || true
          fi
          
          # Upload to R2 with date hierarchy
          for f in dq-upload/*; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              echo "Uploading DQ report $filename..."
              wrangler r2 object put "${{ env.R2_BUCKET }}/data-quality/runs/${RUN_DATE}/$filename" --file="$f" --remote
            fi
          done

      - name: Upload Data Quality Reports as Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-quality-reports
          path: |
            dq-reports/
            soda-reports/

      - name: Clean up
        if: always()
        run: |
          rm -rf ${{ env.DATA_DIR }}/*.zip
          rm -rf dq-reports soda-reports dq-upload
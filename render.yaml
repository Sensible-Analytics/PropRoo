# Render Blueprint - PropRoo Monorepo
# Docs: https://render.com/docs/blueprint-spec

# PostgreSQL Database (managed by Render)
databases:
  - name: proproo-db
    databaseName: proproo
    ipAllowList: []

# Backend: FastAPI Python Web Service
services:
  - type: web
    name: proproo-backend
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proproo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATA_DIR
        value: /tmp

  # Frontend: React + Vite Static Site
  - type: web
    name: proproo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_API_URL
        value: https://proproo-backend.onrender.com/api
    domains:
      - proproo.sensibleanalytics.co

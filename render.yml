services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DATA_DIR=/data
    volumeMounts:
      - data:/data
  frontend:
    build: ./frontend/Dockerfile
    command: npm install && npm run build --port 5173
    ports:
      - "5173:5173"
    restart: always
    environment:
      - VITE_API_URL=http://backend:8000/api

volumes:
  data: